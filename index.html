<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PnL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>PnL Calendar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
    color: var(--text);
    transition: background 0.8s ease, color 0.4s ease;
    background: var(--bg);
    background-attachment: fixed;
  }

  /* ---------- DAY: blue skies ---------- */
  body.theme-day {
    --bg: linear-gradient(180deg, #4ba3e3 0%, #7ec4f2 35%, #b8e2fb 70%, #e3f4fd 100%);
    --surface: rgba(255, 255, 255, 0.62);
    --surface-2: rgba(255, 255, 255, 0.8);
    --border: rgba(255, 255, 255, 0.85);
    --inner-border: rgba(120, 170, 215, 0.35);
    --text: #16395c;
    --text-dim: #4f7396;
    --green: #0f8a3d;
    --green-bg: rgba(46, 204, 113, 0.28);
    --red: #d1303a;
    --red-bg: rgba(239, 83, 80, 0.24);
    --accent: #1d7fd6;
    --accent-soft: rgba(29, 127, 214, 0.15);
    --weekend-bg: rgba(90, 110, 130, 0.13);
    --card-shadow: 0 8px 32px rgba(35, 90, 140, 0.18);
    --glow: none;
  }

  /* ---------- NIGHT: cosmic ---------- */
  body.theme-night {
    --bg: linear-gradient(180deg, #060718 0%, #110b30 35%, #1c1245 65%, #0a0820 100%);
    --surface: rgba(22, 17, 54, 0.55);
    --surface-2: rgba(38, 30, 84, 0.65);
    --border: rgba(148, 120, 255, 0.28);
    --inner-border: rgba(148, 120, 255, 0.18);
    --text: #ece9ff;
    --text-dim: #a59fd1;
    --green: #4ade80;
    --green-bg: rgba(74, 222, 128, 0.16);
    --red: #fb7185;
    --red-bg: rgba(251, 113, 133, 0.16);
    --accent: #a78bfa;
    --accent-soft: rgba(167, 139, 250, 0.18);
    --weekend-bg: rgba(255, 255, 255, 0.05);
    --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    --glow: 0 0 18px rgba(167, 139, 250, 0.35);
  }

  /* ---------- decorative sky layers ---------- */
  .sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }

  .sun {
    position: absolute; top: -90px; right: -90px; width: 280px; height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 244, 191, 0.95) 0%, rgba(255, 226, 130, 0.55) 40%, rgba(255, 226, 130, 0) 70%);
    animation: sunPulse 6s ease-in-out infinite;
  }
  @keyframes sunPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

  .cloud {
    position: absolute;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 50%;
    filter: blur(18px);
    animation: drift linear infinite;
  }
  .cloud.c1 { width: 220px; height: 60px; top: 12%;  animation-duration: 95s; }
  .cloud.c2 { width: 300px; height: 75px; top: 30%;  animation-duration: 140s; animation-delay: -50s; opacity: 0.75; }
  .cloud.c3 { width: 170px; height: 50px; top: 55%;  animation-duration: 110s; animation-delay: -20s; opacity: 0.6; }
  .cloud.c4 { width: 250px; height: 65px; top: 76%;  animation-duration: 160s; animation-delay: -90s; opacity: 0.5; }
  @keyframes drift {
    from { transform: translateX(-360px); }
    to   { transform: translateX(calc(100vw + 360px)); }
  }

  .nebula {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 75% 18%, rgba(167, 139, 250, 0.22), transparent 70%),
      radial-gradient(ellipse 50% 35% at 18% 55%, rgba(96, 165, 250, 0.16), transparent 70%),
      radial-gradient(ellipse 45% 30% at 60% 85%, rgba(244, 114, 182, 0.13), transparent 70%);
  }
  .stars, .stars2 { position: absolute; inset: 0; }
  .stars  { animation: twinkle 4s ease-in-out infinite alternate; }
  .stars2 { animation: twinkle 6s ease-in-out infinite alternate-reverse; }
  @keyframes twinkle { from { opacity: 0.45; } to { opacity: 1; } }

  .moon {
    position: absolute; top: 48px; right: 36px; width: 64px; height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fdfbf3, #d8d4c2 70%);
    box-shadow: 0 0 40px rgba(253, 251, 243, 0.45), inset -12px -8px 0 rgba(160, 155, 135, 0.35);
  }

  body.theme-day .nebula, body.theme-day .stars, body.theme-day .stars2, body.theme-day .moon { display: none; }
  body.theme-night .sun, body.theme-night .cloud { display: none; }

  .container { max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }

  /* ---------- header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; text-shadow: var(--glow); }
  header h1 span { color: var(--accent); }

  .month-nav { display: flex; align-items: center; gap: 8px; }
  button { font-family: inherit; }
  .month-nav button, .toolbar button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 15px;
    cursor: pointer;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: var(--card-shadow);
    transition: transform 0.1s ease, background 0.3s ease;
  }
  .month-nav button:active, .toolbar button:active { transform: scale(0.95); }
  .month-label {
    font-size: 18px;
    font-weight: 700;
    min-width: 170px;
    text-align: center;
    text-shadow: var(--glow);
  }
  .toolbar { display: flex; gap: 8px; }
  .toolbar button { font-size: 13px; color: var(--text-dim); padding: 7px 12px; }
  #themeBtn { font-size: 15px; }

  /* ---------- stats ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: var(--card-shadow);
    transition: background 0.4s ease;
  }
  .stat .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; font-weight: 600; }
  .stat .value { font-size: 20px; font-weight: 800; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }

  .stat.goal { cursor: pointer; }
  .stat.goal .value { font-size: 16px; }
  .goal-bar {
    height: 6px;
    border-radius: 3px;
    background: var(--accent-soft);
    margin-top: 9px;
    overflow: hidden;
  }
  .goal-bar div {
    height: 100%;
    width: 0;
    border-radius: 3px;
    background: var(--accent);
    transition: width 0.5s ease, background 0.3s ease;
  }
  .goal-bar div.reached { background: var(--green); }

  /* ---------- calendar ---------- */
  .calendar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: var(--card-shadow);
    transition: background 0.4s ease;
  }
  .weekdays, .week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }
  .weekdays div {
    padding: 12px 8px;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border-bottom: 1px solid var(--inner-border);
  }
  .day {
    min-height: 96px;
    border-right: 1px solid var(--inner-border);
    border-bottom: 1px solid var(--inner-border);
    padding: 8px;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .week .day:last-child { border-right: none; }
  .calendar .week:last-child .day { border-bottom: none; }
  .day:hover { background: var(--accent-soft); }
  .day.empty { cursor: default; }
  .day.empty:hover { background: transparent; }
  .day.profit { background: var(--green-bg); }
  .day.loss { background: var(--red-bg); }
  .day.weekend { background: var(--weekend-bg); cursor: default; }
  .day.weekend:hover { background: var(--weekend-bg); }
  .day.weekend .num { opacity: 0.45; }
  .day.weekend.has-trades { cursor: pointer; }
  .weekdays div:first-child, .weekdays div:last-child { opacity: 0.45; }
  .day .num { font-size: 13px; color: var(--text-dim); font-weight: 600; }
  .day.today .num {
    color: #fff;
    background: var(--accent);
    border-radius: 50%;
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .day .pnl { font-size: 15px; font-weight: 800; }
  .day .count { font-size: 11px; color: var(--text-dim); }

  /* ---------- modal ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 10, 30, 0.45);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    overflow-y: auto;
    z-index: 10;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    width: 100%;
    max-width: 520px;
    padding: 20px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: var(--card-shadow);
  }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .modal-head h2 { font-size: 17px; }
  .modal-head .day-total { font-size: 15px; font-weight: 800; }
  .close-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
  }
  .close-btn:hover { color: var(--text); }

  .trade-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .trade {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--inner-border);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .trade .sym { font-weight: 800; min-width: 64px; }
  .trade .note { flex: 1; font-size: 13px; color: var(--text-dim); overflow-wrap: anywhere; }
  .trade .amt { font-weight: 800; white-space: nowrap; }
  .trade .del {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
  }
  .trade .del:hover { color: var(--red); }
  .no-trades { color: var(--text-dim); font-size: 14px; text-align: center; padding: 12px 0; }

  .trade-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .trade-form .full { grid-column: 1 / -1; }
  .trade-form label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px; font-weight: 600; }
  .trade-form input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--inner-border);
    border-radius: 10px;
    color: var(--text);
    padding: 9px 10px;
    /* 16px minimum prevents iOS Safari from zooming in on focus */
    font-size: 16px;
  }
  .trade-form input::placeholder { color: var(--text-dim); opacity: 0.7; }
  .trade-form input:focus { outline: none; border-color: var(--accent); }
  .trade-form button {
    grid-column: 1 / -1;
    background: var(--accent);
    border: none;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    box-shadow: var(--glow);
    transition: transform 0.1s ease;
  }
  .trade-form button:active { transform: scale(0.97); }

  @media (max-width: 640px) {
    .day { min-height: 70px; padding: 5px; }
    .day .pnl { font-size: 12px; }
    .day .count { display: none; }
    .month-label { min-width: 130px; font-size: 16px; }
  }
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="cloud c4"></div>
  <div class="nebula"></div>
  <div class="stars" id="stars"></div>
  <div class="stars2" id="stars2"></div>
  <div class="moon"></div>
</div>

<div class="container">
  <header>
    <h1>PnL <span>Calendar</span></h1>
    <div class="month-nav">
      <button id="prevBtn" aria-label="Previous month">&larr;</button>
      <div class="month-label" id="monthLabel"></div>
      <button id="nextBtn" aria-label="Next month">&rarr;</button>
      <button id="todayBtn">Today</button>
    </div>
    <div class="toolbar">
      <button id="themeBtn" title="Theme: auto">🌗</button>
      <button id="exportBtn">Export</button>
      <button id="importBtn">Import</button>
      <input type="file" id="importFile" accept=".json" hidden>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="label">Monthly P&amp;L</div><div class="value" id="statTotal">$0.00</div></div>
    <div class="stat goal" id="goalCard" title="Tap to set your monthly goal">
      <div class="label">Monthly Goal</div>
      <div class="value" id="statGoal">Tap to set</div>
      <div class="goal-bar"><div id="goalBarFill"></div></div>
    </div>
    <div class="stat"><div class="label">Green / Red Days</div><div class="value" id="statDays">0 / 0</div></div>
    <div class="stat"><div class="label">Best Day</div><div class="value" id="statBest">–</div></div>
    <div class="stat"><div class="label">Worst Day</div><div class="value" id="statWorst">–</div></div>
    <div class="stat"><div class="label">Trades</div><div class="value" id="statTrades">0</div></div>
  </div>

  <div class="calendar">
    <div class="weekdays">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div id="grid"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalDate"></h2>
      <div class="day-total" id="modalTotal"></div>
      <button class="close-btn" id="closeModal" aria-label="Close">&times;</button>
    </div>
    <div class="trade-list" id="tradeList"></div>
    <form class="trade-form" id="tradeForm">
      <div>
        <label for="symInput">Symbol</label>
        <input id="symInput" type="text" placeholder="AAPL" autocomplete="off" required>
      </div>
      <div>
        <label for="pnlInput">P&amp;L ($)</label>
        <input id="pnlInput" type="number" step="any" placeholder="-150.50" required>
      </div>
      <div class="full">
        <label for="noteInput">Notes (optional)</label>
        <input id="noteInput" type="text" placeholder="Breakout long, stopped out" autocomplete="off">
      </div>
      <button type="submit">Add Trade</button>
    </form>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = 'pnl-calendar-trades-v1';
  const THEME_KEY = 'pnl-calendar-theme';
  const GOAL_KEY = 'pnl-calendar-goal';

  // ---------- Theme: blue skies by day, cosmic by night ----------
  const themeBtn = document.getElementById('themeBtn');
  // mode: 'auto' | 'day' | 'night'
  let themeMode = localStorage.getItem(THEME_KEY) || 'auto';

  function isDaytime() {
    const h = new Date().getHours();
    return h >= 6 && h < 18;
  }
  function applyTheme() {
    const theme = themeMode === 'auto' ? (isDaytime() ? 'day' : 'night') : themeMode;
    document.body.classList.toggle('theme-day', theme === 'day');
    document.body.classList.toggle('theme-night', theme === 'night');
    const icons = { auto: '🌗', day: '☀️', night: '🌌' };
    themeBtn.textContent = icons[themeMode];
    themeBtn.title = 'Theme: ' + themeMode;
    document.querySelector('meta[name="theme-color"]')
      .setAttribute('content', theme === 'day' ? '#4ba3e3' : '#060718');
  }
  themeBtn.addEventListener('click', () => {
    themeMode = themeMode === 'auto' ? 'day' : themeMode === 'day' ? 'night' : 'auto';
    localStorage.setItem(THEME_KEY, themeMode);
    applyTheme();
  });
  setInterval(() => { if (themeMode === 'auto') applyTheme(); }, 60000);

  // Star field: random dots rendered as box-shadows on 1px elements
  function makeStars(el, count, size, color) {
    const dot = document.createElement('div');
    dot.style.cssText =
      'position:absolute;top:0;left:0;width:' + size + 'px;height:' + size +
      'px;border-radius:50%;background:' + color + ';';
    const shadows = [];
    for (let i = 0; i < count; i++) {
      shadows.push(
        (Math.random() * 100).toFixed(2) + 'vw ' +
        (Math.random() * 100).toFixed(2) + 'vh ' + color
      );
    }
    dot.style.boxShadow = shadows.join(',');
    el.appendChild(dot);
  }
  makeStars(document.getElementById('stars'), 110, 1, '#ffffff');
  makeStars(document.getElementById('stars2'), 45, 2, '#cfd8ff');

  applyTheme();

  // ---------- Data ----------
  // Data shape: { "YYYY-MM-DD": [ { symbol, pnl, note }, ... ] }
  let trades = load();
  let view = new Date();
  view.setDate(1);
  let selectedKey = null;

  function load() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch (e) {
      return {};
    }
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(trades));
  }

  function dateKey(y, m, d) {
    return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }
  function fmtMoney(n) {
    const sign = n < 0 ? '-' : '';
    return sign + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function dayTotal(key) {
    return (trades[key] || []).reduce((s, t) => s + t.pnl, 0);
  }

  function render() {
    const y = view.getFullYear();
    const m = view.getMonth();
    document.getElementById('monthLabel').textContent =
      view.toLocaleString('en-US', { month: 'long', year: 'numeric' });

    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    const firstDow = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const today = new Date();
    const todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());

    let week = document.createElement('div');
    week.className = 'week';
    for (let i = 0; i < firstDow; i++) {
      const cell = document.createElement('div');
      cell.className = 'day empty';
      week.appendChild(cell);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const key = dateKey(y, m, d);
      const list = trades[key] || [];
      const total = dayTotal(key);

      const dow = (firstDow + d - 1) % 7;
      const isWeekend = dow === 0 || dow === 6;

      const cell = document.createElement('div');
      cell.className = 'day';
      if (list.length) cell.classList.add(total >= 0 ? 'profit' : 'loss');
      if (key === todayKey) cell.classList.add('today');
      if (isWeekend) {
        cell.classList.add('weekend');
        if (list.length) cell.classList.add('has-trades');
      }

      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = d;
      cell.appendChild(num);

      if (list.length) {
        const pnl = document.createElement('span');
        pnl.className = 'pnl ' + (total >= 0 ? 'pos' : 'neg');
        pnl.textContent = fmtMoney(total);
        cell.appendChild(pnl);

        const count = document.createElement('span');
        count.className = 'count';
        count.textContent = list.length + (list.length === 1 ? ' trade' : ' trades');
        cell.appendChild(count);
      }

      // weekends aren't tradable — only clickable if old trades exist on them
      if (!isWeekend || list.length) cell.addEventListener('click', () => openDay(key));
      week.appendChild(cell);

      if ((firstDow + d) % 7 === 0 || d === daysInMonth) {
        while (week.children.length < 7) {
          const filler = document.createElement('div');
          filler.className = 'day empty';
          week.appendChild(filler);
        }
        grid.appendChild(week);
        week = document.createElement('div');
        week.className = 'week';
      }
    }

    renderStats(y, m, daysInMonth);
  }

  function renderStats(y, m, daysInMonth) {
    let total = 0, greenDays = 0, redDays = 0, tradeCount = 0;
    let best = null, worst = null;

    for (let d = 1; d <= daysInMonth; d++) {
      const key = dateKey(y, m, d);
      const list = trades[key] || [];
      if (!list.length) continue;
      const t = dayTotal(key);
      total += t;
      tradeCount += list.length;
      if (t >= 0) greenDays++; else redDays++;
      if (best === null || t > best) best = t;
      if (worst === null || t < worst) worst = t;
    }

    setStat('statTotal', fmtMoney(total), total);
    renderGoal(total);
    document.getElementById('statDays').innerHTML =
      '<span class="pos">' + greenDays + '</span> / <span class="neg">' + redDays + '</span>';
    setStat('statBest', best === null ? '–' : fmtMoney(best), best === null ? 0 : best);
    setStat('statWorst', worst === null ? '–' : fmtMoney(worst), worst === null ? 0 : worst);
    document.getElementById('statTrades').textContent = tradeCount;
  }

  function setStat(id, text, value) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.classList.toggle('pos', value > 0);
    el.classList.toggle('neg', value < 0);
  }

  // ---------- Monthly goal ----------
  let goal = parseFloat(localStorage.getItem(GOAL_KEY)) || 0;

  function renderGoal(total) {
    const valEl = document.getElementById('statGoal');
    const bar = document.getElementById('goalBarFill');
    if (goal > 0) {
      const pct = Math.max(0, Math.min(100, (total / goal) * 100));
      const reached = total >= goal;
      valEl.textContent = fmtMoney(total) + ' / ' + fmtMoney(goal);
      valEl.classList.toggle('pos', reached);
      valEl.classList.remove('neg');
      bar.style.width = pct + '%';
      bar.classList.toggle('reached', reached);
    } else {
      valEl.textContent = 'Tap to set';
      valEl.classList.remove('pos', 'neg');
      bar.style.width = '0%';
      bar.classList.remove('reached');
    }
  }

  document.getElementById('goalCard').addEventListener('click', () => {
    const input = prompt('Set your monthly P&L goal in $ (enter 0 to remove):', goal || '');
    if (input === null) return;
    const v = parseFloat(input);
    if (isNaN(v) || v < 0) {
      alert('Please enter a valid dollar amount.');
      return;
    }
    goal = v;
    localStorage.setItem(GOAL_KEY, String(goal));
    render();
  });

  // ---------- Day modal ----------
  const overlay = document.getElementById('overlay');

  function openDay(key) {
    selectedKey = key;
    const [yy, mm, dd] = key.split('-').map(Number);
    document.getElementById('modalDate').textContent =
      new Date(yy, mm - 1, dd).toLocaleDateString('en-US', { weekday: 'short', month: 'long', day: 'numeric', year: 'numeric' });
    renderModal();
    overlay.classList.add('open');
    document.getElementById('symInput').focus();
  }

  function renderModal() {
    const list = trades[selectedKey] || [];
    const total = dayTotal(selectedKey);
    const totalEl = document.getElementById('modalTotal');
    totalEl.textContent = list.length ? fmtMoney(total) : '';
    totalEl.className = 'day-total ' + (total >= 0 ? 'pos' : 'neg');

    const container = document.getElementById('tradeList');
    container.innerHTML = '';
    if (!list.length) {
      const empty = document.createElement('div');
      empty.className = 'no-trades';
      empty.textContent = 'No trades logged for this day.';
      container.appendChild(empty);
      return;
    }
    list.forEach((t, i) => {
      const row = document.createElement('div');
      row.className = 'trade';

      const sym = document.createElement('span');
      sym.className = 'sym';
      sym.textContent = t.symbol;

      const note = document.createElement('span');
      note.className = 'note';
      note.textContent = t.note || '';

      const amt = document.createElement('span');
      amt.className = 'amt ' + (t.pnl >= 0 ? 'pos' : 'neg');
      amt.textContent = fmtMoney(t.pnl);

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.title = 'Delete trade';
      del.addEventListener('click', () => {
        list.splice(i, 1);
        if (!list.length) delete trades[selectedKey];
        save();
        renderModal();
        render();
      });

      row.append(sym, note, amt, del);
      container.appendChild(row);
    });
  }

  function closeModal() {
    overlay.classList.remove('open');
    selectedKey = null;
    document.getElementById('tradeForm').reset();
  }

  document.getElementById('tradeForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const symbol = document.getElementById('symInput').value.trim().toUpperCase();
    const pnl = parseFloat(document.getElementById('pnlInput').value);
    const note = document.getElementById('noteInput').value.trim();
    if (!symbol || isNaN(pnl)) return;

    (trades[selectedKey] = trades[selectedKey] || []).push({ symbol, pnl, note });
    save();
    e.target.reset();
    document.getElementById('symInput').focus();
    renderModal();
    render();
  });

  document.getElementById('closeModal').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
  });

  // ---------- Navigation ----------
  document.getElementById('prevBtn').addEventListener('click', () => {
    view.setMonth(view.getMonth() - 1);
    render();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    view.setMonth(view.getMonth() + 1);
    render();
  });
  document.getElementById('todayBtn').addEventListener('click', () => {
    view = new Date();
    view.setDate(1);
    render();
  });

  // ---------- Export / Import ----------
  document.getElementById('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(trades, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'pnl-calendar-export.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  const importFile = document.getElementById('importFile');
  document.getElementById('importBtn').addEventListener('click', () => importFile.click());
  importFile.addEventListener('change', () => {
    const file = importFile.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (typeof data !== 'object' || data === null || Array.isArray(data)) throw new Error('bad format');
        for (const key of Object.keys(data)) {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(key) || !Array.isArray(data[key])) throw new Error('bad format');
          data[key] = data[key]
            .filter((t) => t && typeof t.symbol === 'string' && typeof t.pnl === 'number')
            .map((t) => ({ symbol: t.symbol, pnl: t.pnl, note: typeof t.note === 'string' ? t.note : '' }));
        }
        trades = data;
        save();
        render();
        alert('Import successful.');
      } catch (e) {
        alert('Invalid file: expected a JSON export from this app.');
      }
      importFile.value = '';
    };
    reader.readAsText(file);
  });

  render();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
})();
</script>
</body>
</html>
